<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edvoy Workforce Intelligence — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#FBFCFD;
  --ink:#1C2434; --ink-2:#54606E; --ink-3:#6B7480;
  --border:#E3E7ED; --border-2:#EDF0F4;
  --brand:#2F5FE0; --brand-ink:#1E3F9E; --brand-soft:#EAF0FE;
  --present:#2E7D5B; --present-soft:#E6F2EC;
  --review:#B7791F; --review-soft:#FBF1DE;
  --problem:#C0453B; --problem-soft:#FBEAE8;
  --remote:#6D5AE0; --remote-soft:#EEEBFB;
  --leave:#2F80B8; --leave-soft:#E6F1F8;
  --slate:#5A6474; --slate-soft:#EEF1F5;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(28,36,52,.04),0 1px 3px rgba(28,36,52,.06);
  --shadow-md:0 4px 16px rgba(28,36,52,.10);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
#root{min-height:100vh}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
::selection{background:var(--brand-soft)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* focus */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}
.rail{width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail-brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-2)}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#5B7BEA);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
.brand-name{font-weight:600;font-size:14px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--ink-3)}
.rail-scroll{overflow-y:auto;flex:1;padding:10px 10px 20px}
.nav-group-label{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:var(--radius-sm);color:var(--ink-2);font-size:13.5px;font-weight:500;position:relative}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.nav-item .ni-ico{width:17px;height:17px;flex-shrink:0;opacity:.9}
.nav-badge{margin-left:auto;background:var(--review-soft);color:var(--review);font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px}
.nav-item.active .nav-badge{background:#fff}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:30}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);min-width:0}
.crumbs .c-cur{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb-link{background:none;border:none;color:var(--ink-3);padding:0;font-size:13px}
.crumb-link:hover{color:var(--brand);text-decoration:underline}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.role-pill{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:4px 6px 4px 12px;font-size:12.5px;color:var(--ink-2)}
.role-pill select{border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;padding:2px}
.role-dot{width:7px;height:7px;border-radius:50%;background:var(--present);display:inline-block;flex:0 0 auto}
.role-pill-cur{color:var(--ink-3);font-weight:500}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--slate-soft);color:var(--slate);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.content{padding:22px 24px 60px;max-width:1360px;width:100%}

/* ---------- Filter bar ---------- */
.filterbar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:18px;box-shadow:var(--shadow)}
.fb-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fb-field{display:flex;flex-direction:column;gap:4px}
.fb-field label{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.fb-field select,.fb-field input{border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 9px;font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);min-width:132px}
.fb-field select:hover{border-color:#CBD2DD}
.fb-daterange{display:flex;align-items:center;gap:6px;background:var(--brand-soft);border:1px solid #D3E0FC;border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer}
.fb-daterange-wrap{position:relative}
.fb-daterange:hover{border-color:var(--brand)}
.dr-menu{position:absolute;z-index:50;top:calc(100% + 6px);left:0;min-width:250px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 34px rgba(20,30,55,.18);padding:6px}
.dr-opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink);cursor:pointer}
.dr-opt:hover{background:var(--surface-2)}
.dr-opt.on{color:var(--brand-ink);font-weight:600}
.dr-default{margin-left:auto;font-size:10px;font-weight:600;color:var(--brand-ink);background:var(--brand-soft);border-radius:4px;padding:1px 6px;text-transform:uppercase;letter-spacing:.03em}
.dr-divide{height:1px;background:var(--border-2);margin:5px 2px}
.dr-custom{padding:6px 10px}
.dr-opt-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);margin-bottom:6px}
.dr-custom.on .dr-opt-label{color:var(--brand-ink);font-weight:600}
.dr-dates{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;padding-left:22px}
.dr-dates label{display:flex;flex-direction:column;font-size:11px;color:var(--ink-3);gap:3px}
.dr-dates input{border:1px solid var(--border);border-radius:6px;padding:5px 7px;font-size:12px;font-family:inherit}
.fb-daterange .fd-ico{color:var(--brand)}
.fb-daterange strong{font-size:13px;color:var(--brand-ink)}
.fb-daterange small{font-size:11px;color:var(--brand)}
.fb-reset{margin-left:auto;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;font-size:12.5px;color:var(--ink-2);font-weight:500;height:34px}
.fb-reset:hover{background:var(--surface-2);color:var(--ink)}
.fb-active{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--slate-soft);border-radius:20px;padding:3px 6px 3px 11px;font-size:12px;color:var(--ink-2)}
.chip button{border:none;background:none;color:var(--ink-3);width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
.chip button:hover{background:#DDE2EA;color:var(--ink)}

/* ---------- Page header ---------- */
.page-head{margin-bottom:16px}
.page-title{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0 0 3px}
.page-desc{font-size:13.5px;color:var(--ink-2);margin:0;max-width:760px}
.page-head-row{display:flex;align-items:flex-start;gap:16px}
.page-head-row .phr-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0}

/* ---------- Cards / KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 13px;box-shadow:var(--shadow);text-align:left;position:relative;transition:border-color .12s,transform .12s;display:flex;flex-direction:column;gap:2px}
.kpi.clickable{cursor:pointer}
.kpi.clickable:hover{border-color:#C3CFEA;transform:translateY(-1px)}
.kpi-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.kpi-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-label{font-size:12.5px;color:var(--ink-2);font-weight:500;line-height:1.25}
.kpi-value{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1}
.kpi-value small{font-size:14px;font-weight:600;color:var(--ink-3)}
.kpi-foot{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px}
.kpi-note{margin-top:5px;font-size:11px;color:var(--ink-3);line-height:1.3}
.trend{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:12px}
.trend.up{color:var(--present)}
.trend.down{color:var(--review)}
.trend.flat{color:var(--ink-3)}
.trend.up.inv{color:var(--review)}
.trend.down.inv{color:var(--present)}
.kpi-prev{color:var(--ink-3)}
.info-btn{border:none;background:none;color:var(--ink-3);width:18px;height:18px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.info-btn:hover{background:var(--slate-soft);color:var(--brand)}
.kpi-info{position:absolute;top:11px;right:11px}

/* ---------- Popover ---------- */
.pop-wrap{position:relative;display:inline-flex}
.popover{position:absolute;z-index:60;top:calc(100% + 8px);right:0;width:290px;background:var(--ink);color:#EAEEF6;border-radius:9px;padding:12px 13px;box-shadow:var(--shadow-md);font-size:12.5px;line-height:1.5;font-weight:400;text-align:left}
.popover.left{right:auto;left:0}
.popover h5{margin:0 0 5px;font-size:12.5px;font-weight:700;color:#fff;letter-spacing:.01em}
.popover .formula{font-family:var(--mono);font-size:11.5px;background:rgba(255,255,255,.09);border-radius:6px;padding:7px 8px;margin:7px 0;color:#CFE0FF;line-height:1.45;white-space:pre-wrap}
.popover .pop-note{color:#AEB9CC;font-size:11.5px;margin-top:6px}
.popover:after{content:"";position:absolute;bottom:100%;right:14px;border:6px solid transparent;border-bottom-color:var(--ink)}
.popover.left:after{right:auto;left:14px}

/* ---------- Sections / panels ---------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
.panel-body.flush{border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius);overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border-2)}
.panel-title{font-size:14.5px;font-weight:600;margin:0}
.panel-sub{font-size:12.5px;color:var(--ink-3)}
.panel-head .ph-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.panel-body{padding:16px}
.panel-body.flush{padding:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:1080px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;max-width:100%}
.rl-grid{min-width:0}
.rl-grid>div{min-width:0}
@media(max-width:1080px){.rl-grid{grid-template-columns:1fr!important}}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{color:var(--ink)}
table.data th .sort-ar{opacity:.5;margin-left:3px}
table.data td{padding:11px 14px;border-bottom:1px solid var(--border-2);vertical-align:middle;white-space:nowrap}
table.data tbody tr:last-child td{border-bottom:none}
table.data tr.clickable{cursor:pointer}
table.data tbody tr.clickable:hover{background:var(--brand-soft)}
table.data tbody tr:nth-child(even){background:var(--surface-2)}
table.data tbody tr:nth-child(even).clickable:hover{background:var(--brand-soft)}
.emp-cell{display:flex;align-items:center;gap:10px}
.emp-cell .ec-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11.5px;flex-shrink:0}
.emp-cell .ec-name{font-weight:600;color:var(--ink);font-size:13px}
.emp-cell .ec-sub{font-size:11.5px;color:var(--ink-3)}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
th.num{text-align:right}

/* ---------- Badges / status ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px 3px 7px;border-radius:20px;white-space:nowrap;line-height:1.3}
.badge .b-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.badge svg{width:12px;height:12px}
.b-neutral{background:var(--slate-soft);color:var(--slate)}
.b-neutral .b-dot{background:var(--slate)}
.b-present{background:var(--present-soft);color:var(--present)}
.b-present .b-dot{background:var(--present)}
.b-review{background:var(--review-soft);color:var(--review)}
.b-review .b-dot{background:var(--review)}
.b-problem{background:var(--problem-soft);color:var(--problem)}
.b-problem .b-dot{background:var(--problem)}
.b-remote{background:var(--remote-soft);color:var(--remote)}
.b-remote .b-dot{background:var(--remote)}
.b-leave{background:var(--leave-soft);color:var(--leave)}
.b-leave .b-dot{background:var(--leave)}
.b-brand{background:var(--brand-soft);color:var(--brand-ink)}
.b-brand .b-dot{background:var(--brand)}

/* bars */
.minibar{display:inline-flex;align-items:center;gap:8px}
.minibar .track{width:60px;height:6px;border-radius:4px;background:var(--border-2);overflow:hidden}
.minibar .fill{height:100%;border-radius:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:var(--radius-sm);padding:8px 13px;font-size:13px;font-weight:600;transition:.12s}
.btn:hover{background:var(--surface-2);border-color:#CBD2DD}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--problem);border-color:#EAC7C4}
.btn.danger:hover{background:var(--problem-soft)}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* segmented */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px}
.seg button{border:none;background:none;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);border-radius:5px}
.seg button.on{background:var(--surface);color:var(--brand-ink);box-shadow:var(--shadow)}

/* ---------- States (loading/empty/error/incomplete) ---------- */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px 24px;color:var(--ink-2)}
.state .st-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.state h4{margin:0 0 5px;font-size:15px;color:var(--ink);font-weight:600}
.state p{margin:0 0 14px;font-size:13px;max-width:400px}
.skel{background:linear-gradient(90deg,#EEF1F5 25%,#F6F8FA 50%,#EEF1F5 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:6px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-row{height:44px;margin:0;border-radius:0;border-bottom:1px solid var(--border-2)}
.banner{display:flex;align-items:flex-start;gap:11px;border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.5}
.banner .bn-ico{flex-shrink:0;margin-top:1px}
.banner strong{font-weight:600}
.banner.warn{background:var(--review-soft);border:1px solid #F0DCB0;color:#7A5312}
.banner.warn strong{color:#63430E}
.banner.info{background:var(--brand-soft);border:1px solid #D3E0FC;color:var(--brand-ink)}
.banner.err{background:var(--problem-soft);border:1px solid #EAC7C4;color:#8A2E26}
.banner .bn-act{margin-left:auto;flex-shrink:0}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
@media(max-width:900px){.login-wrap{grid-template-columns:1fr}.login-aside{display:none}}
.login-aside{background:linear-gradient(155deg,#1C2434 0%,#243356 60%,#2F5FE0 140%);color:#fff;padding:52px 54px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.login-aside:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 0);background-size:22px 22px}
.la-brand{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
.la-brand .logo{width:36px;height:36px;font-size:17px}
.la-mid{margin-top:auto;position:relative;z-index:1}
.la-mid h1{font-size:31px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0 0 14px;max-width:440px}
.la-mid p{font-size:14.5px;color:#C4CFE6;line-height:1.6;max-width:410px;margin:0 0 26px}
.la-points{display:flex;flex-direction:column;gap:13px}
.la-point{display:flex;align-items:flex-start;gap:11px;font-size:13.5px;color:#DAE2F1}
.la-point .lp-ico{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.la-foot{margin-top:auto;padding-top:36px;font-size:12px;color:#8A97B4;position:relative;z-index:1}
.login-main{display:flex;align-items:center;justify-content:center;padding:40px}
.login-card{width:100%;max-width:392px}
.login-card h2{font-size:23px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
.login-card .lc-sub{font-size:14px;color:var(--ink-2);margin:0 0 28px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;border:1px solid var(--border);background:#fff;border-radius:9px;padding:12px;font-size:14.5px;font-weight:600;color:#3c4043;box-shadow:var(--shadow);transition:.12s}
.gbtn:hover{background:#F8F9FB;box-shadow:var(--shadow-md)}
.gbtn:disabled{opacity:.7}
.gspin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-note{display:flex;align-items:flex-start;gap:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;margin-top:20px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.login-legal{font-size:12px;color:var(--ink-3);margin-top:22px;line-height:1.5}
.login-domain{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;background:var(--brand-soft);color:var(--brand-ink);padding:2px 8px;border-radius:6px}

/* heatmap */
.heat-wrap{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:0;font-size:12px}
table.heat th{position:sticky;top:0;background:var(--surface);font-size:10.5px;font-weight:600;color:var(--ink-3);padding:6px 4px;text-align:center;min-width:30px}
table.heat th.corner{left:0;z-index:3;text-align:left;padding-left:14px;min-width:210px}
table.heat td.rowh{position:sticky;left:0;background:var(--surface);z-index:1;padding:5px 14px;border-right:1px solid var(--border)}
table.heat td.wk{background:var(--surface-2)}
.hcell{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;margin:2px auto;cursor:pointer;border:1px solid transparent}
.hcell:hover{outline:2px solid var(--brand);outline-offset:1px}
.hc-P{background:var(--present-soft);color:var(--present)}
.hc-R{background:var(--remote-soft);color:var(--remote)}
.hc-L{background:var(--leave-soft);color:var(--leave)}
.hc-A{background:var(--problem-soft);color:var(--problem)}
.hc-late{background:var(--review-soft);color:var(--review)}
.hc-WO{background:#F1F3F6;color:var(--ink-3)}
.hc-H{background:#EDEBF6;color:#6B5DA8}
.hc-M{background:#FFF;color:var(--ink-3);border:1px dashed #C9D0DB}
.hc-none{background:#FAFBFC;color:#C3CAD5;border:1px dashed var(--border)}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:14px}
.leg-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.leg-sw{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}

/* wizard steps */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:9px;padding:6px 0}
.step .s-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;border:2px solid var(--border);color:var(--ink-3);background:var(--surface)}
.step.done .s-num{background:var(--present);border-color:var(--present);color:#fff}
.step.on .s-num{background:var(--brand);border-color:var(--brand);color:#fff}
.step .s-lbl{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.step.on .s-lbl,.step.done .s-lbl{color:var(--ink)}
.step-sep{width:26px;height:2px;background:var(--border);margin:0 8px}
.step-sep.done{background:var(--present)}

/* dropzone */
.dropzone{border:2px dashed #C9D2E0;border-radius:var(--radius);padding:40px 24px;text-align:center;background:var(--surface-2);transition:.15s;cursor:pointer}
.dropzone:hover{border-color:var(--brand);background:var(--brand-soft)}
.dropzone .dz-ico{width:52px;height:52px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}

/* type cards */
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.type-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:var(--surface);text-align:left;transition:.12s;position:relative}
.type-card:hover{border-color:var(--brand);box-shadow:var(--shadow-md)}
.type-card.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.tc-top{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.tc-ico{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tc-name{font-weight:600;font-size:14px}
.tc-cols{font-size:11.5px;color:var(--ink-3);line-height:1.5}
.tc-meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid var(--border-2);font-size:11.5px;color:var(--ink-3)}

/* mapping grid */
.map-row{display:grid;grid-template-columns:1fr 26px 1fr 130px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-2)}
.map-src{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:7px 10px}
.map-arrow{color:var(--ink-3);text-align:center}
.map-row select{border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-family:inherit;font-size:12.5px;width:100%}

/* progress */
.prog-track{height:8px;border-radius:6px;background:var(--border-2);overflow:hidden}
.prog-fill{height:100%;background:var(--brand);border-radius:6px;transition:width .4s}
.stage-list{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.stage{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;font-size:13px}
.stage.done{color:var(--ink-2)}
.stage.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.stage.pending{color:var(--ink-3)}
.stage .sg-ico{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* profile */
.prof-head{display:flex;gap:18px;align-items:flex-start}
.prof-av{width:66px;height:66px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;flex-shrink:0}
.prof-meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 22px;margin-top:16px}
.pm-item .pm-l{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.pm-item .pm-v{font-size:13.5px;color:var(--ink);font-weight:500}
.def-row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--border-2);font-size:13px}
.def-row .dl{color:var(--ink-2)}
.def-row .dv{font-weight:600;font-family:var(--mono)}

/* bars chart */
.barchart{display:flex;flex-direction:column;gap:11px}
.bc-row{display:grid;grid-template-columns:150px 1fr 52px;gap:12px;align-items:center;font-size:12.5px}
.bc-label{color:var(--ink-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-track{height:20px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bc-fill{height:100%;border-radius:5px;display:flex;align-items:center;padding-left:8px;font-size:11px;color:#fff;font-weight:600}
.bc-val{font-family:var(--mono);text-align:right;color:var(--ink);font-weight:600}

/* trendline (svg) */
.spark{width:100%;height:120px;display:block}
.spark-summary{display:flex;flex-direction:column;justify-content:center;align-items:center;height:120px;gap:4px;text-align:center}
.ss-val{font-size:34px;font-weight:700;line-height:1}
.ss-note{font-size:11.5px;color:var(--ink-3)}
.spark-wrap{position:relative;width:100%}
.spark-hit{position:absolute;inset:0;display:flex}
.spark-seg{flex:1;cursor:pointer;outline:none}
.spark-seg:focus-visible{background:rgba(47,95,224,.06)}
.spark-tip{position:absolute;transform:translate(-50%,calc(-100% - 10px));background:var(--ink);color:#fff;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;line-height:1.35;white-space:nowrap;pointer-events:none;z-index:40;box-shadow:0 6px 18px rgba(20,30,55,.22);display:flex;flex-direction:column;align-items:center;gap:1px}
.spark-tip::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink)}
.spark-tip-l{font-size:10.5px;font-weight:500;opacity:.75;text-transform:uppercase;letter-spacing:.03em}
.spark-tip-v{font-size:13px}

/* toggles */
.tog{width:38px;height:22px;border-radius:20px;background:var(--border);border:none;position:relative;transition:.15s;flex-shrink:0}
.tog.on{background:var(--brand)}
.tog:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on:after{left:18px}

.setting-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border-2)}
.setting-row .sr-main{flex:1}
.sr-title{font-weight:600;font-size:13.5px;margin-bottom:2px}
.sr-desc{font-size:12.5px;color:var(--ink-2)}
.sr-ctrl{flex-shrink:0;display:flex;align-items:center;gap:10px}
.inp{border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:var(--mono);font-size:13px;width:88px;text-align:right}
.inp-unit{font-size:12.5px;color:var(--ink-3)}

.pill-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:0}
.pill-tab{border:none;background:none;padding:11px 15px;font-size:13.5px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.pill-tab:hover{color:var(--ink)}
.pill-tab.on{color:var(--brand-ink);border-bottom-color:var(--brand)}

.coach{background:var(--brand-soft);border:1px solid #D3E0FC;border-radius:var(--radius);padding:14px 15px}
.coach h5{margin:0 0 8px;font-size:13px;color:var(--brand-ink);display:flex;align-items:center;gap:7px}
.coach ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:12.5px;line-height:1.7}

.divide{height:1px;background:var(--border-2);margin:16px 0}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.hl{color:var(--brand-ink);font-weight:600}
.tag{font-family:var(--mono);font-size:11.5px;background:var(--slate-soft);color:var(--slate);padding:1px 6px;border-radius:5px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.mt0{margin-top:0}.mb0{margin-bottom:0}
.flexbtwn{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gap8{display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:14px}

/* --- skip link (a11y) --- */
.skip-link{position:absolute;left:8px;top:-48px;z-index:200;background:var(--brand);color:#fff;padding:9px 14px;border-radius:8px;font-weight:600;font-size:13px;transition:top .15s}
.skip-link:focus{top:8px}

/* --- modal / dialog --- */
.modal-overlay{position:fixed;inset:0;background:rgba(28,36,52,.42);display:flex;align-items:center;justify-content:center;z-index:120;padding:24px}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 12px 48px rgba(28,36,52,.24);max-width:640px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:820px}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border-2)}
.modal-head h3{margin:0;font-size:16px;font-weight:600}
.modal-head .mh-sub{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.modal-head .mh-close{margin-left:auto;border:none;background:none;color:var(--ink-3);width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-head .mh-close:hover{background:var(--surface-2);color:var(--ink)}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--border-2);background:var(--surface-2)}
.modal-foot .mf-right{margin-left:auto;display:flex;gap:8px}

/* evidence rows in day modal */
.ev-row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--border-2);font-size:13px}
.ev-row .evl{color:var(--ink-2)}
.ev-row .evv{font-weight:600;font-family:var(--mono);text-align:right}

/* --- toast --- */
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#EAEEF6;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:9px;animation:toastin .2s ease}
.toast .t-ico{color:var(--present)}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* --- saved views --- */
.savedviews{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.sv-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--ink-2)}
.sv-chip:hover{border-color:var(--brand);color:var(--brand-ink)}
.sv-chip.on{background:var(--brand-soft);border-color:#D3E0FC;color:var(--brand-ink)}
.sv-label{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;margin-right:2px}

/* --- row checkbox + bulk bar --- */
.cbx{width:17px;height:17px;border:1.6px solid #C2CAD6;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);cursor:pointer;flex-shrink:0;padding:0}
.cbx.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cbx svg{width:12px;height:12px}
.bulkbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--brand-soft);border:1px solid #D3E0FC;border-radius:var(--radius);margin-bottom:12px}
.bulkbar strong{color:var(--brand-ink)}
.bulkbar .bb-right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* --- quick action (…) menu --- */
.qa-wrap{position:relative;display:inline-flex}
.qa-btn{border:none;background:none;color:var(--ink-3);width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.qa-btn:hover{background:var(--surface-2);color:var(--ink)}
.qa-menu{position:absolute;right:0;top:calc(100% + 4px);z-index:40;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow-md);min-width:190px;padding:5px;text-align:left}
.qa-item{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--ink);text-align:left}
.qa-item:hover{background:var(--surface-2)}
.qa-item svg{width:15px;height:15px;color:var(--ink-2)}

/* attention / next-action banner */
.attention{display:flex;align-items:center;gap:13px;background:linear-gradient(90deg,var(--brand-soft),#F3F7FF);border:1px solid #D3E0FC;border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
.attention .at-ico{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.attention .at-main{flex:1}
.attention .at-title{font-weight:600;font-size:14px;margin-bottom:1px}
.attention .at-sub{font-size:12.5px;color:var(--ink-2)}
.attention .at-actions{display:flex;gap:8px;flex-shrink:0}

/* export field rows */
.exp-opt{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}

/* responsive: rail + filter + tables (mobile/tablet) */
@media(max-width:920px){
  .app{flex-direction:column}
  .rail{width:100%;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto}
  .rail-brand{border-bottom:none;border-right:1px solid var(--border-2);white-space:nowrap}
  .rail-scroll{display:flex;flex-direction:row;gap:4px;padding:8px;overflow-x:auto}

  .nav-item{white-space:nowrap}

  .kpi-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}
  .fb-row{gap:8px}
  .fb-field select,.fb-field input{min-width:120px}
  .grid-2[style],.grid-3{grid-template-columns:1fr!important}
}

const NOW = new Date("2026-07-31T17:30:00");
const DATA_START = new Date("2026-07-01T00:00:00"); // earliest imported day in the sample
const dayMs = 86400000;
const startOfDay=(d)=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
const startOfWeek=(d)=>{const x=startOfDay(d);const wd=(x.getDay()+6)%7;/*Mon=0*/x.setDate(x.getDate()-wd);return x;};
const startOfMonth=(d)=>new Date(d.getFullYear(),d.getMonth(),1);
const fmtD=(d)=>d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"});
const fmtDShort=(d)=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});

// §17a — date-range presets (calendar-aligned by default). Each yields {start,end,label,sub,bucket}.
const DATE_RANGES = {
  today:    { key:"today",    label:"Today",         bucket:"hour" },
  yesterday:{ key:"yesterday",label:"Yesterday",     bucket:"hour" },
  week:     { key:"week",     label:"This week",     bucket:"day"  },
  month:    { key:"month",    label:"This month",    bucket:"week" },  // default
  quarter:  { key:"quarter",  label:"Last 3 months", bucket:"week" },
  custom:   { key:"custom",   label:"Custom range",  bucket:"auto" },
};
const DEFAULT_RANGE_KEY = "month";

// Resolve a range key (+ optional custom start/end ISO) to concrete bounds and bucketing.
function resolveRange(rk, customStart, customEnd){
  const end = NOW;
  let start, sub, bucket;
  switch(rk){
    case "today":     start=startOfDay(NOW); sub="Today · "+fmtD(NOW); bucket="hour"; break;
    case "yesterday": start=startOfDay(new Date(NOW-dayMs));
                      return {key:rk,start,end:startOfDay(NOW),label:"Yesterday",sub:"Yesterday · "+fmtD(start),bucket:"hour"};
    case "week":      start=startOfWeek(NOW); sub="This week · "+fmtD(start)+" – "+fmtD(NOW); bucket="day"; break;
    case "quarter":   start=startOfMonth(new Date(NOW.getFullYear(),NOW.getMonth()-2,1)); sub="Last 3 months · "+fmtD(start)+" – "+fmtD(NOW); bucket="week"; break;
    case "custom": {
      start=customStart?new Date(customStart+"T00:00:00"):startOfMonth(NOW);
      const cend=customEnd?new Date(customEnd+"T23:59:59"):NOW;
      const span=(cend-start)/dayMs;
      bucket = span<=2?"hour": span<=42?"day": span<=120?"week":"month";
      return {key:rk,start,end:cend,label:"Custom range",sub:fmtD(start)+" – "+fmtD(cend),bucket};
    }
    case "month":
    default:          start=startOfMonth(NOW); sub="Month to date · "+fmtD(start)+" – "+fmtD(NOW); bucket="week"; break;
  }
  return {key:rk,start,end,label:(DATE_RANGES[rk]||DATE_RANGES.month).label,sub,bucket};
}

// Portion of the imported data actually covered by the range (coverage honesty, §17a).
function rangeCoverage(r){
  const covStart=r.start>DATA_START?r.start:DATA_START;
  const dataEnd=NOW;
  const covered = r.end>=DATA_START && r.start<=dataEnd;
  const beyond = r.start<DATA_START; // range asks for data older than we have
  return {covered, beyond, covStart, note: beyond?("Showing available data — imported records begin "+fmtD(DATA_START)):null};
}

/* §17b — Trend bucketing. Re-buckets a weekly base series to match the selected range so the
   x-axis stays honest. The sample stores weekly base points; we resample/label by bucket unit.
   Returns {points:[v...], labels:[...], unit, summaryOnly:boolean}. */
function bucketTrend(baseWeekly, r){
  const unit = r.bucket==="auto" ? "week" : r.bucket;
  // Too short for a trend → single summary value, never a one-point line (§17b).
  if(unit==="hour"){
    // A single day: we don't have punch-level hourly data in the sample → summary value.
    const v = baseWeekly[baseWeekly.length-1];
    return {points:[v], labels:[r.label], unit:"hour", summaryOnly:true};
  }
  if(unit==="day"){
    // This week → ~5 working-day points, honestly derived from the latest weekly value with mild variation.
    const base=baseWeekly[baseWeekly.length-1];
    const days=["Mon","Tue","Wed","Thu","Fri"];
    const pts=days.map((_,i)=>Math.round((base+(i-2))*10)/10);
    return {points:pts, labels:days, unit:"day", summaryOnly:false};
  }
  if(unit==="month"){
    // Long custom → collapse weekly to ~3 monthly means.
    const per=Math.ceil(baseWeekly.length/3);
    const pts=[],labels=[]; for(let i=0;i<baseWeekly.length;i+=per){const seg=baseWeekly.slice(i,i+per);pts.push(Math.round(seg.reduce((a,b)=>a+b,0)/seg.length*10)/10);labels.push("M"+(labels.length+1));}
    return {points:pts, labels, unit:"month", summaryOnly:pts.length<2};
  }
  // week (default: This month, Last 3 months)
  let pts=baseWeekly.slice(), labels=pts.map((_,i)=>"Wk "+(i+1));
  if(r.key==="quarter"){ // ~12–13 weekly points across 3 months
    const q=[]; for(let i=0;i<13;i++){ q.push(baseWeekly[i%baseWeekly.length]); }
    pts=q; labels=q.map((_,i)=>"W"+(i+1));
  }
  return {points:pts, labels, unit:"week", summaryOnly:pts.length<2};
}

  return (
    <span className="pop-wrap" ref={ref}>
      <button className="info-btn" aria-label={"How this is calculated: "+title}

/* Sparkline / simple honest line chart */
function Spark({data,color="var(--brand)",height=120,label,fmt=(v)=>v,labels,summaryOnly,unit}){
  // §17b — too few points for an honest trend → single summary value, never a one-point line.
  if(summaryOnly || data.length<2){
    return <div className="spark-summary" role="img" aria-label={label}>
      <div className="ss-val" style={{color}}>{fmt(data[data.length-1])}</div>
      <div className="ss-note">{labels&&labels.length?labels[labels.length-1]:"Current"} · too short a range for a trend</div>
    </div>;
  }
  const w=560,h=height,pad=8;
  const max=Math.max(...data),min=Math.min(...data);
  const rng=(max-min)||1;
  const [hover,setHover]=useState(null);
  const pts=data.map((v,i)=>{
    const x=pad+(i/(data.length-1))*(w-pad*2);
    const y=h-pad-((v-min)/rng)*(h-pad*2-14);
    return [x,y];
  });
  const dPath=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=dPath+` L ${pts[pts.length-1][0].toFixed(1)} ${h-pad} L ${pts[0][0].toFixed(1)} ${h-pad} Z`;
  const uid=useRef("sg"+Math.random().toString(36).slice(2,8)).current;
  const hp = hover!=null ? pts[hover] : null;
  return <div className="spark-wrap">
    <svg className="spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" role="img" aria-label={label}>
      <defs><linearGradient id={uid} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor={color} stopOpacity=".16"/><stop offset="100%" stopColor={color} stopOpacity="0"/>
      </linearGradient></defs>
      <path d={area} fill={`url(#${uid})`}/>
      <path d={dPath} fill="none" stroke={color} strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>
      {hp && <line x1={hp[0]} y1={pad} x2={hp[0]} y2={h-pad} stroke="var(--border)" strokeWidth="1" strokeDasharray="3 3"/>}
      {pts.map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r={hover===i?"4":"2.6"} fill={hover===i?color:"#fff"} stroke={color} strokeWidth="1.6"/>)}
    </svg>
    {/* Hover hit-areas + tooltip in HTML so the tooltip layers above the SVG and isn't clipped */}
    <div className="spark-hit" onMouseLeave={()=>setHover(null)}>
      {data.map((v,i)=><div key={i} className="spark-seg"
        onMouseEnter={()=>setHover(i)}
        onFocus={()=>setHover(i)} onBlur={()=>setHover(null)}
        tabIndex={0} role="img"
        aria-label={(labels?labels[i]+": ":"")+fmt(v)}/>)}
    </div>
    {hp && <div className="spark-tip" style={{left:(hp[0]/w*100)+"%", top:(hp[1]/h*100)+"%"}}>
      {labels && <span className="spark-tip-l">{labels[hover]}</span>}
      <span className="spark-tip-v">{fmt(data[hover])}</span>
    </div>}
  </div>;
}
// §17b — a trend that re-buckets to the active range. `base` is the weekly base series.
function TrendChart({base,range,color,unitFmt,metricLabel,height}){
  const r = range || resolveRange(DEFAULT_RANGE_KEY);

    {!b.summaryOnly && <div className="flexbtwn small muted" style={{marginTop:6}}>
      <span>{UNIT_LABEL[b.unit]} · {r.label}</span>
      <span>{b.labels[0]} – {b.labels[b.labels.length-1]}</span>

}

/* Day-evidence generator (deterministic sample punches behind a day) */
function dayEvidence(emp,day){
  const seed=(emp.id.charCodeAt(3)*7+day*13)%100;
  const inH=9+(seed%3), inM=(seed*7)%60;
  const outH=18+(seed%2), outM=(seed*3)%60;
  const eff=(outH*60+outM)-(inH*60+inM);
  return {
    date:day+" Jul 2026", scheduled: emp.flex?"Flexible":emp.shift,
    clockIn: String(inH).padStart(2,"0")+":"+String(inM).padStart(2,"0"),
    premiseIn: seed%4===0?"Remote Clock In":"Edvoy Office",
    clockOut: seed%9===0?"—":String(outH).padStart(2,"0")+":"+String(outM).padStart(2,"0"),
    premiseOut: seed%4===0?"Remote Clock In":"Edvoy Office",
    effective: seed%9===0?0:eff,
    required: emp.req,
    late: emp.flex?null:Math.max(0,(inH*60+inM)-(parseInt(emp.shift)*60+ (emp.shift.includes("30")?30:0) )-10),
    source:"IMP-2042",
  };
}
function DayEvidenceModal({emp,day,onClose}){
  const ev=dayEvidence(emp,day);
  return <Modal title={"Day evidence — "+emp.name} sub={ev.date+" · every figure traces to its punches"} onClose={onClose}
    footer={<div className="mf-right"><button className="btn" onClick={onClose}>Close</button></div>}>
    <div className="ev-row"><span className="evl">Scheduled</span><span className="evv">{ev.scheduled}</span></div>
    <div className="ev-row"><span className="evl">Clock in</span><span className="evv">{ev.clockIn} · {ev.premiseIn}</span></div>
    <div className="ev-row"><span className="evl">Clock out</span><span className="evv">{ev.clockOut}{ev.clockOut!=="—"?" · "+ev.premiseOut:""}</span></div>
    <div className="ev-row"><span className="evl">Effective hours</span><span className="evv">{ev.clockOut==="—"?"Missing clock-out":hm(ev.effective)}</span></div>
    <div className="ev-row"><span className="evl">Required hours</span><span className="evv">{hm(ev.required)}</span></div>
    {!emp.flex && <div className="ev-row"><span className="evl">Late minutes</span><span className="evv">{ev.late>30?<span style={{color:"var(--review)"}}>{ev.late} (late)</span>:(ev.late==null?"—":ev.late)}</span></div>}
    <div className="ev-row"><span className="evl">Source import</span><span className="evv">{ev.source}</span></div>

      <div>This is the raw evidence behind the day’s classification. No value here is inferred — a blank punch is shown as “missing”, never as absence.</div></div>
  </Modal>;
}

/* ============================ Sortable insight-list shell ============================ */
function InsightPage({title,desc,scope,threshold,columns,rows=[],nav,defaultSort,formula,empty,coach,reportType,toast=window.__toast}){
  const [sortKey,setSortKey]=useState(defaultSort||columns.find(c=>c.sortable)?.key);
  const [dir,setDir]=useState("desc");
  const [filter,setFilter]=useState(EMPTY_FILTER);
  const [sel,setSel]=useState(()=>new Set());
  const [bulkStatus,setBulkStatus]=useState("");
  const [showExport,setShowExport]=useState(false);
  const filtered=useMemo(()=>applyFilters(rows,filter),[rows,filter]);
  const sorted=useMemo(()=>{
    if(!sortKey) return filtered;
    const col=columns.find(c=>c.key===sortKey);
    return [...filtered].sort((a,b)=>{
      const va=col.sortVal?col.sortVal(a):a[sortKey], vb=col.sortVal?col.sortVal(b):b[sortKey];
      if(va==null)return 1; if(vb==null)return -1;
      return dir==="desc"?(vb-va):(va-vb);
    });
  },[filtered,sortKey,dir]);
  const onSort=(k)=>{ if(sortKey===k) setDir(d=>d==="desc"?"asc":"desc"); else {setSortKey(k);setDir("desc");} };
  const toggle=(id)=>setSel(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  const allOn=sorted.length>0 && sorted.every(e=>sel.has(e.id));
  const toggleAll=()=>setSel(allOn?new Set():new Set(sorted.map(e=>e.id)));
  const applyBulk=()=>{ if(!bulkStatus)return; sorted.forEach(e=>{if(sel.has(e.id))e.review=bulkStatus;}); const n=sel.size; setSel(new Set()); setBulkStatus(""); toast&&toast(n+" employee"+(n>1?"s":"")+" set to “"+(REVIEW_LABELS[bulkStatus]?.t||bulkStatus)+"”"); };
  return (
    <div className="content">
      <div className="page-head"><div className="page-head-row"><div>
        <h1 className="page-title" tabIndex={-1}>{title}</h1><p className="page-desc">{desc}</p></div>
        <div className="phr-actions"><button className="btn sm" onClick={()=>setShowExport(true)}>{Ico.download} Export</button></div></div></div>
      <FilterBar scope={scope} value={filter} onChange={setFilter} savedViews={SAVED_VIEWS}/>
      <Banner kind="info" icon={Ico.info}><strong>How this list is built.</strong> {threshold} Frequency is suppressed where the denominator is too small to be reliable — those employees show a coverage note instead.</Banner>
      {sel.size>0 && <div className="bulkbar">
        <Checkbox on={allOn} onChange={toggleAll} label="Select all"/>
        <strong>{sel.size} selected</strong>
        <div className="bb-right">
          <select value={bulkStatus} onChange={e=>setBulkStatus(e.target.value)} style={{border:"1px solid var(--border)",borderRadius:7,padding:"7px 10px",fontFamily:"inherit",fontSize:13}}>
            <option value="">Set review status…</option>
            {REVIEW_STATUSES.map(([k,l])=><option key={k} value={k}>{l}</option>)}
          </select>
          <button className="btn sm primary" disabled={!bulkStatus} onClick={applyBulk}>Apply to {sel.size}</button>
          <button className="btn sm" onClick={()=>setSel(new Set())}>Clear</button>
        </div>
      </div>}
      {sorted.length===0 ? <div className="panel"><EmptyState icon={rows.length===0?Ico.check:Ico.search}
        title={rows.length===0?"No employees currently meet this threshold":"No employees match these filters"}
        desc={rows.length===0?(empty||"Nobody in this scope crosses the configured threshold for the current month."):"Try clearing or changing the filters above."}/></div> :
      <div className="panel">
        <div className="panel-head"><h3 className="panel-title">{sorted.length}{sorted.length!==rows.length?" of "+rows.length:""} employees</h3>
          <div className="ph-right small muted">Select rows for bulk actions · click a row to open the profile</div></div>
        <div className="panel-body flush"><div className="tbl-wrap"><table className="data">
          <thead><tr>
            <th style={{width:34}}><Checkbox on={allOn} onChange={toggleAll} label="Select all rows"/></th>
            {columns.map(c=>(
            <th key={c.key} scope="col" className={(c.num?"num ":"")+(c.sortable?"sortable":"")}
              onClick={c.sortable?()=>onSort(c.key):undefined} aria-sort={sortKey===c.key?(dir==="desc"?"descending":"ascending"):undefined}>
              {c.label}{c.info&&<> <Popover title={c.info.title}>{c.info.body}</Popover></>}
              {c.sortable&&<span className="sort-ar">{sortKey===c.key?(dir==="desc"?"↓":"↑"):"↕"}</span>}</th>))}
            <th></th></tr></thead>
          <tbody>{sorted.map((e,i)=>(
            <tr key={e.id} className="clickable" onClick={()=>nav("profile",e)}>
              <td onClick={e2=>e2.stopPropagation()}><Checkbox on={sel.has(e.id)} onChange={()=>toggle(e.id)} label={"Select "+e.name}/></td>
              {columns.map(c=><td key={c.key} className={c.num?"num":""}>{c.render(e,i)}</td>)}
              <td className="right" onClick={e2=>e2.stopPropagation()}>
                <QuickActions items={[
                  {icon:Ico.user,label:"Open profile",onClick:()=>nav("profile",e)},
                  ...(window.__role!=="readonly"?[{icon:Ico.note,label:"Review & notes",onClick:()=>nav("workflow",e)}]:[]),
                  {icon:Ico.calendar,label:"View heatmap",onClick:()=>nav("heatmap")},
                ]}/>
              </td>
            </tr>))}</tbody>
        </table></div></div>
      </div>}
      {coach && <div className="coach" style={{marginTop:4}}><h5>{Ico.info} Before you reach out</h5><ul>{coach.map((c,i)=><li key={i}>{c}</li>)}</ul></div>}
      {showExport && <ExportModal reportType={reportType||title} count={sorted.length} filters={filter} scope={scope} onClose={()=>setShowExport(false)} toast={toast}/>}
    </div>
  );
}

const DAYS_JUL = Array.from({length:31},(_,i)=>i+1);
const WEEKEND = (d)=>{ const dow=new Date(2026,6,d).getDay(); return dow===0||dow===6; };
// deterministic status per employee/day
function cellStatus(e,d){
  if(WEEKEND(d)) return {c:"WO",l:"Weekly off",lab:"WO"};
  if(d===15) return {c:"H",l:"Public holiday",lab:"H"};   // sample location holiday
  const seed=(e.id.charCodeAt(3)*31 + d*7)%100;
  if(e.confAbs>0 && (d>=21&&d<=24) && e.id==="ED344") return {c:"A",l:"Confirmed absence",lab:"A"};
  if(e.potAbs>0 && d===23 && e.id!=="ED344") return {c:"A",l:"Potential absence",lab:"?"};
  if(d>29 && e.lastAtt && parseInt(e.lastAtt)<d) return {c:"none",l:"No data yet",lab:"·"};
  if(seed<6) return {c:"M",l:"Missing clock-out",lab:"!"};
  if(e.remoteDays>10 && seed<55) return {c:"R",l:"Present remotely",lab:"R"};
  if(seed<12 && e.remoteDays>0) return {c:"R",l:"Present remotely",lab:"R"};
  if(e.leaveDays>0 && seed>92) return {c:"L",l:"Approved leave",lab:"L"};
  if(!e.flex && e.lateDays>0 && seed>=(100-(e.lateDays*3))) return {c:"late",l:"Late arrival",lab:"L↑"};
  return {c:"P",l:"Present in office",lab:"P"};
}

const CLOSED_STATUSES=["resolved","noaction"];
const TODAY="2026-08-03";
function isOverdue(r){ return r.followUp && !r.closed && new Date(r.followUp) < new Date(TODAY); }

/* Review-log store — mutable so Save review (workflow) and the Review Log share one source (C1). */
const REVIEW_LOG_SUBS=new Set();
function reviewLogNotify(){ REVIEW_LOG_SUBS.forEach(fn=>fn()); }
function useReviewLog(){
  const [,force]=useState(0);
  useEffect(()=>{ const fn=()=>force(x=>x+1); REVIEW_LOG_SUBS.add(fn); return ()=>REVIEW_LOG_SUBS.delete(fn); },[]);
  return REVIEW_LOG;
}
let __rvSeq=1043;
function nextReviewId(){ return "RV-"+(__rvSeq++); }
// Map a workflow save into a review record: update the open record for this employee, or create one.
function saveReviewRecord({emp, status, action, followUp, noteHR, notePrivate, mgr}){
  const label = (REVIEW_STATUS_LABEL[status]||status);
  const actionLabel = (ACTION_LABEL[action]||"");
  const now = TODAY+" "+new Date().toTimeString().slice(0,5);
  const closed = CLOSED_STATUSES.includes(status) ? TODAY : null;
  let rec = REVIEW_LOG.find(r=>r.empId===emp.id && !r.closed);
  if(rec){
    rec.status=status; if(action)rec.action=action;
    rec.followUp=followUp||rec.followUp; rec.closed=closed;
    if(noteHR)rec.noteHR=noteHR; if(notePrivate)rec.notePrivate=notePrivate;
    rec.trail=[...rec.trail, {t:now, who:mgr||"You", act:"Status → "+label, detail:actionLabel?("Action: "+actionLabel):""}];
  } else {
    rec={ id:nextReviewId(), empId:emp.id, emp:emp.name, sub:emp.sub, mgr:mgr||"You",
      pattern: emp.lateDays>=4?"Frequently late":emp.shortDays>=4?"Below required hours":emp.confAbs>0?"Absence review":"Mixed pattern",
      opened:TODAY, status, action:action||"none", followUp:followUp||null, closed,
      noteHR:noteHR||"", notePrivate:notePrivate||"",
      trail:[{t:now, who:mgr||"You", act:"Review opened", detail:""},
             {t:now, who:mgr||"You", act:"Status → "+label, detail:actionLabel?("Action: "+actionLabel):""}] };
    REVIEW_LOG.unshift(rec);
  }
  reviewLogNotify();
  return rec;
}

// §12a.3 — Compare with previous: diff vs the previous successful import of the same type.
function CompareImportModal({im,prev,onClose}){
  if(!prev) return null;
  const added=Math.max(0,im.ins-prev.ins), removed=Math.max(0,prev.rows-im.rows>0?prev.rows-im.rows:0);
  const updated=im.upd, unchanged=Math.max(0,im.rows-added-updated);
  const identical = added===0 && updated===0 && removed===0;
  const rowsD=[["Added",added,"var(--present)"],["Updated",updated,"var(--brand)"],["Unchanged",unchanged,"var(--slate)"],["Removed / absent",removed,"var(--review)"]];
  return <Modal title="Compare with previous import" sub={im.id+"  vs  "+prev.id+" · "+im.type} onClose={onClose}
    footer={<><span className="small muted">Read-only comparison</span><div className="mf-right"><button className="btn primary" onClick={onClose}>Close</button></div></>}>
    {identical ? <EmptyState icon={Ico.check} title="No differences" desc={"Identical to "+prev.id+" — a re-upload of the same data (matching fingerprint), so nothing changed."}/> :
    <>
      <div className="def-row"><span className="dl">This import</span><span className="dv">{im.id} · {im.when}</span></div>
      <div className="def-row"><span className="dl">Previous ({im.type})</span><span className="dv">{prev.id} · {prev.when}</span></div>
      <div style={{marginTop:14}}><BarChart rows={rowsD.map(([label,v,color])=>({label,v,color}))}/></div>
      <div className="small muted" style={{marginTop:12}}>{React.cloneElement(Ico.info,{s:13})} Differences use the same fingerprint + logical-key identity as import idempotency, so a re-upload reports no churn.</div>
    </>}
  </Modal>;
}

          <div className="sr-ctrl"><span className="small muted">Total</span><button className={"tog"+(effMeasure?" on":"")} onClick={()=>setEffMeasure(v=>!v)} aria-pressed={effMeasure}/><span className="small">Effective</span></div></div>
        <div className="setting-row"><div className="sr-main"><div className="sr-title">Frequent short-hours threshold</div><div className="sr-desc">Share of attended days below required hours that flags an employee.</div></div>
          <div className="sr-ctrl"><span className="inp-unit">&gt;</span><input className="inp" defaultValue="20"/><span className="inp-unit">%</span></div></div>
        <div className="setting-row"><div className="sr-main"><div className="sr-title">Frequent absence threshold</div><div className="sr-desc">Confirmed unexplained days in a period before an employee is flagged.</div></div>

      </div>

const REQUESTS=[{name:"Ravi Menon",email:"ravi@edvoy.com",when:"Today, 08:30",note:"New sales manager — need my team's attendance view."}];
const REQ_SUBS=new Set();
function reqNotify(){ REQ_SUBS.forEach(fn=>fn()); }
function addAccessRequest(req){ REQUESTS.unshift(req); reqNotify(); }
function resolveAccessRequest(email){ const i=REQUESTS.findIndex(r=>r.email===email); if(i>=0)REQUESTS.splice(i,1); reqNotify(); }
function useRequests(){ const [,f]=useState(0); useEffect(()=>{const fn=()=>f(x=>x+1);REQ_SUBS.add(fn);return ()=>REQ_SUBS.delete(fn);},[]); return REQUESTS; }

/* Users store — so Approve/Add actually create users and role changes take effect (P1.2, P1.3). */
const USER_SUBS=new Set();
function userNotify(){ USER_SUBS.forEach(fn=>fn()); }
function useUsers(){ const [,f]=useState(0); useEffect(()=>{const fn=()=>f(x=>x+1);USER_SUBS.add(fn);return ()=>USER_SUBS.delete(fn);},[]); return USERS; }
function addUser(u){ USERS.push(u); userNotify(); }
function setUserRole(email,role){ const u=USERS.find(x=>x.email===email); if(u){const old=u.role; u.role=role; userNotify(); return old;} }

/* Audit store — real entries so the log reflects what users actually did (P1.5). */
const AUDIT_SUBS=new Set();
function auditNotify(){ AUDIT_SUBS.forEach(fn=>fn()); }
function useAudit(){ const [,f]=useState(0); useEffect(()=>{const fn=()=>f(x=>x+1);AUDIT_SUBS.add(fn);return ()=>AUDIT_SUBS.delete(fn);},[]); return AUDIT; }
function auditLog(actor,action,entity,cls){ AUDIT.unshift({when:"Just now",actor,action,entity,cls:cls||"b-neutral"}); auditNotify(); }

const HOLIDAYS={
  "IEC Chennai":[["01 Jan 2026","New Year’s Day"],["14 Jan 2026","Pongal"],["26 Jan 2026","Republic Day"],["15 Jul 2026","Local holiday"]],
  "Hyderabad":[["01 Jan 2026","New Year’s Day"],["26 Jan 2026","Republic Day"],["31 Oct 2026","Diwali"]],
  "Vijayawada":[["01 Jan 2026","New Year’s Day"],["26 Jan 2026","Republic Day"]],
  "Bengaluru":[["01 Jan 2026","New Year’s Day"],["01 Nov 2026","Kannada Rajyotsava"]],
};
const PREMISES=[
  {name:"Edvoy Office",cls:"Office"},{name:"Remote Clock In",cls:"Remote"},{name:"WFH",cls:"Remote"},
  {name:"Vijayawada",cls:"Office (location leak)"},{name:"Attendance Adjustment",cls:"Manual / unknown"},
];
function HolidayPremiseSettings(){
  const [loc,setLoc]=useState("IEC Chennai");
  const [premises,setPremises]=useState(PREMISES);
  const setClass=(i,v)=>setPremises(p=>p.map((x,j)=>j===i?{...x,cls:v}:x));
  const [holidays,setHolidays]=useState(HOLIDAYS);
  const [adding,setAdding]=useState(false);
  const [hDate,setHDate]=useState(""); const [hName,setHName]=useState("");
  const fmtDate=(iso)=>{ if(!iso)return ""; const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); };
  const addHoliday=()=>{
    if(!hDate||!hName.trim())return;
    const label=fmtDate(hDate);
    setHolidays(h=>({...h,[loc]:[...(h[loc]||[]),[label,hName.trim()]].sort((a,b)=>new Date(a[0])-new Date(b[0]))}));
    auditLog("syed@edvoy.com","Holiday added",loc+" · "+label+" "+hName.trim(),"b-neutral");
    setHDate("");setHName("");setAdding(false);toast("Holiday added for "+loc+" · effective "+label);
  };
  const removeHoliday=(idx)=>setHolidays(h=>({...h,[loc]:h[loc].filter((_,j)=>j!==idx)}));
  return <div className="content">
    <div className="page-head"><h1 className="page-title" tabIndex={-1}>Holiday & premise settings</h1>
      <p className="page-desc">Manage the holiday calendar per location and how each clock-in premise is classified. Holidays apply by the employee’s location; a holiday is never counted as absence or short hours.</p></div>
    <Banner kind="info" icon={Ico.info}>Holiday dates must resolve to a real 2026 date or they’re quarantined on import — never guessed. Unmapped premises default to “unclassified” and are flagged.</Banner>
    <div className="grid-2" style={{alignItems:"start"}}>
      <div className="panel"><div className="panel-head"><h3 className="panel-title">Holiday calendar</h3>
        <div className="ph-right"><select value={loc} onChange={e=>setLoc(e.target.value)} style={{border:"1px solid var(--border)",borderRadius:7,padding:"6px 9px",fontFamily:"inherit",fontSize:13}}>
          {Object.keys(HOLIDAYS).map(l=><option key={l}>{l}</option>)}</select></div></div>
        <div className="panel-body flush">{(holidays[loc]||[]).length===0?<EmptyState icon={Ico.calendar} title="No holidays loaded for this location" desc="Import a holiday sheet for this location in the Import Centre, or add one below."/>:
          <table className="data" style={{width:"100%"}}>
            <thead><tr><th scope="col">Date</th><th scope="col">Public holiday</th><th className="right">Action</th></tr></thead>
            <tbody>{holidays[loc].map((h,i)=><tr key={i}><td className="mono">{h[0]}</td><td>{h[1]}</td>
              <td className="right"><button className="btn sm ghost" aria-label="Remove holiday" onClick={()=>removeHoliday(i)}>{React.cloneElement(Ico.x,{s:14})}</button></td></tr>)}</tbody>
          </table>}
          <div style={{padding:12,borderTop:"1px solid var(--border-2)"}}>
            {!adding ? <button className="btn sm" onClick={()=>setAdding(true)}>{Ico.calendar} Add holiday</button>
            : <div style={{display:"flex",gap:8,alignItems:"flex-end",flexWrap:"wrap"}}>
                <div><label className="pm-l" style={{display:"block",marginBottom:4}}>Effective date</label>
                  <input type="date" className="inp" style={{textAlign:"left"}} value={hDate} onChange={e=>setHDate(e.target.value)} autoFocus/></div>
                <div style={{flex:1,minWidth:140}}><label className="pm-l" style={{display:"block",marginBottom:4}}>Holiday name</label>
                  <input className="inp" style={{width:"100%",textAlign:"left"}} value={hName} onChange={e=>setHName(e.target.value)} placeholder="e.g. Diwali"/></div>
                <button className="btn sm primary" disabled={!hDate||!hName.trim()} onClick={addHoliday}>{Ico.check} Add</button>
                <button className="btn sm" onClick={()=>{setAdding(false);setHDate("");setHName("");}}>Cancel</button>
              </div>}
          </div>
        </div>
      </div>
      <div className="panel"><div className="panel-head"><h3 className="panel-title">Premise mapping</h3>
        <span className="panel-sub">Drives office vs remote classification</span></div>
        <div className="panel-body flush"><table className="data" style={{width:"100%"}}>
          <thead><tr><th scope="col">Premise text</th><th scope="col">Classified as</th></tr></thead>
          <tbody>{premises.map((p,i)=><tr key={i}>
            <td className="mono">{p.name}</td>
            <td><select value={p.cls} onChange={e=>setClass(i,e.target.value)} style={{border:"1px solid var(--border)",borderRadius:6,padding:"6px 9px",fontFamily:"inherit",fontSize:12.5}}>
              {["Office","Remote","Office (location leak)","Manual / unknown","Unclassified"].map(o=><option key={o}>{o}</option>)}</select></td>
          </tr>)}</tbody>
        </table></div>
      </div>
    </div>
    <div className="gap8"><button className="btn primary" onClick={()=>toast("Holiday & premise settings saved · recalculation queued")}>{Ico.check} Save changes</button>
      <span className="small muted">Saving reclassifies affected days and records the change in the audit log.</span></div>
  </div>;
}

/* ============================ APP SHELL + ROUTER ============================ */
const NAV_GROUPS=[
  {label:"Dashboards",items:[
    {key:"manager",label:"My team",icon:Ico.grid,roles:["manager","admin"]},
    {key:"org",label:"Organisation",icon:Ico.building,roles:["admin","readonly"]},
  ]},
  {label:"Attendance insights",items:[
    {key:"late",label:"Frequently late",icon:Ico.clockAlert,roles:["manager","admin","readonly"]},
    {key:"short",label:"Below required hours",icon:Ico.hourglass,roles:["manager","admin","readonly"]},
    {key:"absence",label:"Absence review",icon:Ico.userx,roles:["manager","admin","readonly"]},
    {key:"remote",label:"Remote attendance",icon:Ico.home,roles:["manager","admin","readonly"]},
    {key:"heatmap",label:"Team heatmap",icon:Ico.calendar,roles:["manager","admin","readonly"]},
  ]},
  {label:"Workflow",items:[
    {key:"workflow",label:"Review workflow",icon:Ico.checklist,roles:["manager","admin"],badge:"3"},
    {key:"reviewlog",label:"Review log",icon:Ico.history,roles:["manager","admin","readonly"]},
  ]},
  {label:"Import Centre",items:[
    {key:"import",label:"Import Centre",icon:Ico.upload,roles:["admin","hr"]},
    {key:"importHistory",label:"Import history",icon:Ico.history,roles:["admin","hr"]},
  ]},
  {label:"Administration",items:[
    {key:"policy",label:"Policy settings",icon:Ico.sliders,roles:["admin"]},
    {key:"holidays",label:"Holiday & premises",icon:Ico.map,roles:["admin"]},
    {key:"users",label:"Users & admins",icon:Ico.users,roles:["admin"]},
    {key:"health",label:"System health",icon:Ico.pulse,roles:["admin","hr"]},
    {key:"audit",label:"Audit log",icon:Ico.shield,roles:["admin"]},
  ]},
];
const CRUMB_LABEL={manager:"My team",org:"Organisation",late:"Frequently late",short:"Below required hours",
  absence:"Absence review",remote:"Remote attendance",heatmap:"Team heatmap",workflow:"Review workflow",reviewlog:"Review log",
  profile:"Employee profile",import:"Import Centre",importUpload:"Upload",importPreview:"Preview & map",
  importValidate:"Validation",importProcess:"Processing",importHistory:"Import history",importDetail:"Import detail",
  policy:"Policy settings",holidays:"Holiday & premises",users:"Users & admins",health:"System health",audit:"Audit log"};

function App(){
  const [signedIn,setSignedIn]=useState(false);
  const [denied,setDenied]=useState(false);
  const reqsLive=useRequests(); // live pending-access-request count for the rail badge (P1.6)
  const [role,setRole]=useState("manager"); // manager | admin | hr | readonly
  const [screen,setScreen]=useState("manager");
  const [arg,setArg]=useState(null);
  const [trail,setTrail]=useState([]);

  const ROLE_HOME={manager:"manager",admin:"org",hr:"import",readonly:"org"};
  // Screens reachable per role (rail items + drill-down children).
  const ROLE_KEYS={
    manager:["manager","late","short","absence","remote","heatmap","workflow","reviewlog","profile","importDetail"],
    admin:["org","manager","late","short","absence","remote","heatmap","workflow","reviewlog","profile",
      "import","importUpload","importPreview","importValidate","importProcess","importHistory","importDetail",
      "policy","holidays","users","health","audit"],
    hr:["import","importUpload","importPreview","importValidate","importProcess","importHistory","importDetail","health"],
    readonly:["org","late","short","absence","remote","heatmap","reviewlog","profile"],
  };

  // Guard: keep the active screen reachable by the current role. Declared before any
  // early return so hook order stays identical across signed-out / signed-in renders.
  useEffect(()=>{
    if(!signedIn) return;
    const ok=(ROLE_KEYS[role]||ROLE_KEYS.manager).includes(screen);
    if(!ok){ const home=ROLE_HOME[role]||"manager"; setScreen(home); setArg(null); setTrail([]);
      // BL-12: never redirect silently — tell the user why the screen changed.
      if(window.__toast) window.__toast("That screen isn’t available for your role — returned to your home view");
    }
  },[signedIn,role,screen]);

  const DRILLDOWN=["profile","workflow","importDetail","importUpload","importPreview","importValidate","importProcess"];
  const nav=(key,a=null)=>{
    if(key===screen && (a?.id||a?.key||"")===(arg?.id||arg?.key||"")){ window.scrollTo(0,0); return; }
    if(DRILLDOWN.includes(key)){
      setTrail(t=>{
        const here={key:screen,arg};
        const last=t[t.length-1];
        if(last && last.key===here.key && (last.arg?.id||last.arg?.key||"")===(here.arg?.id||here.arg?.key||"")) return t;
        return [...t,here];
      });
    } else {
      setTrail([]);
    }
    setScreen(key); setArg(a);
    window.scrollTo(0,0);
  };
  window.__nav=nav;
  window.__toast=toast;
  window.__role=role;
  // a11y: move focus to the main heading on every screen change
  useEffect(()=>{ const h=document.getElementById("main-content"); if(h){ const head=h.querySelector("h1"); (head||h).focus?.(); } },[screen,arg]);
  const back=(to,idx)=>{ setScreen(to.key); setArg(to.arg); setTrail(t=>t.slice(0,idx)); window.scrollTo(0,0); };

  const switchRole=(r)=>{ setRole(r); setScreen(ROLE_HOME[r]||"manager"); setArg(null); setTrail([]); };

  if(denied) return <AccessDenied onBackToLogin={()=>{setDenied(false);}}/>;
  if(!signedIn) return <Login onSignIn={()=>{setSignedIn(true);setScreen(ROLE_HOME[role]||"manager");}} onDenied={()=>setDenied(true)}/>;

  const visibleGroups=NAV_GROUPS.map(g=>({...g,items:g.items.filter(it=>it.roles.includes(role))})).filter(g=>g.items.length>0);

  // Screens reachable by the current role: rail items + their drill-down children.
  const railKeys=new Set(visibleGroups.flatMap(g=>g.items.map(it=>it.key)));
  const CHILDREN={
    manager:["profile","workflow"],org:["profile","workflow"],
    late:["profile"],short:["profile"],absence:["profile"],remote:["profile"],
    heatmap:["profile"],workflow:["profile"],profile:["workflow","importDetail"],
    import:["importUpload","importPreview","importValidate","importProcess"],
    importHistory:["importDetail"],importDetail:[],health:["import"],
  };
  const allowed=new Set(railKeys);
  railKeys.forEach(k=>(CHILDREN[k]||[]).forEach(c=>allowed.add(c)));
  // Drill-down children of children (e.g. import wizard chain, profile->importDetail)
  ["importUpload","importPreview","importValidate","importProcess","importDetail","profile","workflow"].forEach(k=>{
    if(allowed.has("import")||allowed.has("importHistory")||allowed.has("manager")||allowed.has("org")) allowed.add(k);
  });

  const screens={
    manager:<ManagerDashboard nav={nav} role={role}/>, org:<OrgDashboard nav={nav} role={role}/>,
    late:<FreqLate nav={nav}/>, short:<FreqShort nav={nav}/>, absence:<AbsenceReview nav={nav}/>,
    remote:<RemoteAnalysis nav={nav}/>, heatmap:<Heatmap nav={nav}/>,
    profile:<Profile emp={arg} nav={nav} role={role}/>, workflow:<ReviewWorkflow emp={arg} nav={nav}/>, reviewlog:<ReviewLog nav={nav} role={role}/>,
    import:<ImportCentre nav={nav}/>, importUpload:<ImportUpload type={arg} nav={nav}/>,
    importPreview:<ImportPreview type={arg} nav={nav}/>, importValidate:<ImportValidate type={arg} nav={nav}/>,
    importProcess:<ImportProcess type={arg} nav={nav}/>, importHistory:<ImportHistory nav={nav}/>,
    importDetail:<ImportDetail imp={arg} nav={nav} role={role}/>,
    policy:<PolicySettings/>, holidays:<HolidayPremiseSettings/>, users:<UserManagement/>, health:<SystemHealth nav={nav}/>, audit:<AuditLog/>,
  };

  const screenAllowed = allowed.has(screen);
  const curLabel = screen==="profile" && arg ? arg.name : (CRUMB_LABEL[screen]||"");
  // Remount key: changes whenever the screen OR the drill-down subject changes,
  // so each navigation gets a fresh component instance (no stale useState).
  const argId = arg ? (arg.id||arg.key||arg.name||"") : "";
  const screenKey = screen+":"+argId;

  return (
    <div className="app">
      <a href="#main-content" className="skip-link">Skip to content</a>
      <ToastHost/>
      <aside className="rail">
        <div className="rail-brand"><div className="logo">E</div>
          <div><div className="brand-name">Edvoy</div><div className="brand-sub">Workforce Intelligence</div></div></div>
        <nav className="rail-scroll">
          {visibleGroups.map(g=>(
            <div key={g.label}>
              <div className="nav-group-label">{g.label}</div>
              {g.items.map(it=>(
                <button key={it.key} className={"nav-item"+(screen===it.key?" active":"")} onClick={()=>nav(it.key)}>
                  <span className="ni-ico">{it.icon}</span>{it.label}
                  {it.key==="users" && reqsLive.length>0 ? <span className="nav-badge">{reqsLive.length}</span> : (it.badge && <span className="nav-badge">{it.badge}</span>)}
                </button>))}
            </div>))}
        </nav>
      </aside>

      <div className="main">
        <header className="topbar">
          <div className="crumbs">
            {trail.map((t,i)=><React.Fragment key={i}>
              <button className="crumb-link" onClick={()=>back(t,i)}>{t.key==="profile"&&t.arg?t.arg.name:(CRUMB_LABEL[t.key]||"Back")}</button>
              <span>{React.cloneElement(Ico.chevR,{s:14})}</span>
            </React.Fragment>)}
            <span className="c-cur">{curLabel}</span>
          </div>
          <div className="topbar-right">
            <div className="role-pill"><span className="role-dot" aria-hidden="true"/>{React.cloneElement(Ico.shield,{s:15})} <span className="role-pill-cur">Active role:</span>
              <select value={role} onChange={e=>switchRole(e.target.value)}>
                <option value="manager">Reporting Manager</option>
                <option value="admin">Administrator</option>
                <option value="hr">HR Data Operator</option>
                <option value="readonly">Read-Only Viewer</option>
              </select>
            </div>
            <div className="gap8"><div className="avatar">{({admin:"SZ",hr:"PR",readonly:"AK",manager:"BS"})[role]||"BS"}</div>
              <button className="info-btn" title="Sign out" onClick={()=>{setSignedIn(false);setRole("manager");setScreen("manager");}}>{React.cloneElement(Ico.logout,{s:17})}</button></div>
          </div>
        </header>
        <main id="main-content" tabIndex={-1} style={{flex:1,outline:"none"}} key={screenKey}>{screens[screen]||<div className="content"><EmptyState title="Screen not found" desc=""/></div>}</main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
